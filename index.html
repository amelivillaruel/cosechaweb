<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Cosecha</title>
    <link rel="shortcut icon" href="imas.jpeg" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4"
  >
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="card border-0 shadow rounded-4 overflow-hidden">
            <div class="bg-primary text-white text-center p-4">
              <h1 class="h4 fw-bold mb-1">Calculadora de Cosecha</h1>
              <p class="small mb-0 opacity-75">
                Calcula al instante el pago de tus cosechadores
              </p>
            </div>

            <div class="card-body p-4">
              <div>
                <span class="badge text-bg-primary rounded-pill mb-2"
                  >Paso 1</span
                >
                <label
                  for="numeroMultiplicar"
                  class="form-label fw-semibold d-block"
                >
                  Define el monto a pagar por Terada:
                </label>

                <div class="input-group input-group-lg mb-3">
                  <span class="input-group-text fw-bold text-success">×</span>
                  <input
                    type="number"
                    step="any"
                    id="numeroMultiplicar"
                    class="form-control"
                    placeholder=""
                  />
                </div>
              </div>
              <div class="mb-4">
                <span class="badge text-bg-primary rounded-pill mb-2"
                  >Paso 2</span
                >
                <label
                  for="numeroDividir"
                  class="form-label fw-semibold d-block"
                >
                  Ingresa el monto total de Libras que cosechó :
                </label>

                <div class="input-group input-group-lg mb-3">
                  <input
                    type="number"
                    step="any"
                    id="numeroDividir"
                    class="form-control"
                    placeholder=""
                  />
                  <span class="input-group-text fw-bold text-primary"
                    >÷ 12</span
                  >
                </div>

                <div
                  class="alert bg-primary-subtle border-primary-subtle text-primary-emphasis rounded-3 text-center mb-0 p-3"
                >
                  <div class="small fw-semibold mb-1">
                    La cantidad de Teradas es:
                  </div>
                  <div id="resultadoDivision" class="fs-2 fw-bold">0.00</div>
                </div>
                <br />
                <div
                  class="alert bg-success-subtle border-success-subtle text-success-emphasis rounded-3 text-center mb-0 p-3"
                >
                  <div class="small fw-semibold mb-1">El monto a pagar es:</div>
                  <div id="resultadoFinal" class="fs-2 fw-bold">0.00 BS 💵</div>
                </div>
              </div>
            </div>
            <a href="" class="text-center"
              ><button type="reset" class="btn btn-primary">Borrar</button></a
            >
            <hr />
            <p class="text-center">Desarrollado por:</p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
